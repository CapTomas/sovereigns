name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
defaults:
  run:
    shell: bash
jobs:
  # .NET build, format check, simulation tests, content validation and determinism on every desktop OS (ADR-0003).
  simulation:
    name: simulation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      # Without this, Windows checks text files out with CRLF and `dotnet format` rejects them.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false && git config --global core.eol lf
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore (locked)
        run: dotnet restore Sovereigns.slnx
      - name: Check formatting
        run: dotnet format Sovereigns.slnx --verify-no-changes --no-restore
      - name: Build (warnings are errors)
        run: dotnet build Sovereigns.slnx -c Release --no-restore
      - name: Run simulation tests
        run: dotnet test Sovereigns.slnx -c Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Validate content
        run: dotnet run --project tools/Sovereigns.Headless -c Release --no-build -- validate-content
      - name: Check fixture determinism
        run: python tools/ci/check_determinism.py --write artifacts/determinism/${{ matrix.os }}.json -- dotnet run --project tools/Sovereigns.Headless -c Release --no-build -- run --fixture F-EMPTY
      - name: Upload test results and failure reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulation-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # ADR-0004 §3: measure whether the fixture checksum is identical across operating systems.
  determinism:
    needs: simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download per-OS fixture summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simulation-*
          path: artifacts/all
      - name: Compare checksums across operating systems
        run: python3 tools/ci/check_determinism.py --compare artifacts/all

  # Godot client under the headless display driver: import, C# build, client tests, shell launch and leak check.
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Cache Godot editor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sovereigns/godot
          key: godot-editor-${{ runner.os }}-${{ hashFiles('tools/toolchain.json') }}
      - name: Install Godot (pinned, SHA-512 verified)
        run: bash tools/ci/install_godot.sh "$HOME/.cache/sovereigns/godot"
      - name: Import resources
        timeout-minutes: 5
        run: godot --headless --path game --import
      - name: Build C# solution
        timeout-minutes: 10
        run: godot --headless --path game --build-solutions --quit
      - name: Run client tests
        timeout-minutes: 5
        run: python3 tools/ci/run_checked.py --log artifacts/logs/client-tests.log --timeout 240 -- godot --headless --path game res://tests/ClientTests.tscn
      # The run must create the world and shut down through the client's own path, and print no engine errors.
      - name: Launch shell and check for leaks
        timeout-minutes: 5
        run: >-
          python3 tools/ci/run_checked.py --log artifacts/logs/shell-smoke.log --timeout 120
          --require "world created" --require "shutdown"
          --forbid "leaked at exit" --forbid "ObjectDB instances leaked" --forbid "still in use at exit" --forbid "ERROR:"
          -- godot --headless --verbose --path game --quit-after 300 -- --fixture F-EMPTY
      - name: Upload logs and failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-failure
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Export the Linux build and prove the packaged binary creates the seeded empty world, before and after merge.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Cache Godot editor and export templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sovereigns/godot
            ~/.local/share/godot/export_templates
          key: godot-package-${{ runner.os }}-${{ hashFiles('tools/toolchain.json') }}
      - name: Install Godot and export templates (pinned, SHA-512 verified)
        run: bash tools/ci/install_godot.sh "$HOME/.cache/sovereigns/godot" --templates
      - name: Import resources
        timeout-minutes: 5
        run: godot --headless --path game --import
      - name: Export Linux release build
        timeout-minutes: 15
        # Godot publishes with -r linux-x64; the simulation project lists that RID, so locked restore still holds.
        run: |
          mkdir -p artifacts/package/linux
          python3 tools/ci/run_checked.py --log artifacts/logs/export.log --timeout 840 \
            --forbid "completed with warnings" --forbid 'Project export for preset "Linux" failed' \
            -- godot --headless --path game --export-release "Linux" "$GITHUB_WORKSPACE/artifacts/package/linux/sovereigns.x86_64"
          test -x artifacts/package/linux/sovereigns.x86_64
      - name: Add content and third-party notices
        run: |
          cp -R content artifacts/package/linux/content
          python3 tools/ci/write_notices.py artifacts/package/linux/THIRD-PARTY-NOTICES.txt
      - name: Run packaged build
        timeout-minutes: 5
        run: >-
          python3 tools/ci/run_checked.py --log artifacts/logs/package-smoke.log --timeout 120
          --require "world created" --require "shutdown" --forbid "ERROR:"
          -- artifacts/package/linux/sovereigns.x86_64 --headless --quit-after 120 -- --scenario core:scenario/empty_world --seed 20261009
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: artifacts/package/linux/
          if-no-files-found: error
          retention-days: 3
      - name: Upload logs and failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-failure
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
